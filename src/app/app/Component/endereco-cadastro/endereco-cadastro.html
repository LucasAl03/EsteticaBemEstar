<div id="endereco-form">

    <h3 class="titulo">Endereço</h3>

    <form class="endereco" (submit)="enviaDados()"  ngNativeValidate>
        <label for="cep">Cep</label>
        <input type="text" id="cep" name="cep" inputmode="numeric" maxlength="8" [(ngModel)]="cep" required>

        <label for="numero">Número</label>
        <input type="text" id="numero" name="numero" inputmode="numeric" maxlength="10" [(ngModel)]="numero" required>

        <label for="complemento">Complemento</label>
        <input type="text" id="complemento" name="complemento" maxlength="150" [(ngModel)]="complemento" required>
        
        <div class="btns">
            <button type="submit">{{!editar ? 'Confirmar' : 'Salvar Alterações'}}</button>
            <button type="reset">Limpar</button>
        </div>
    </form>
</div>
