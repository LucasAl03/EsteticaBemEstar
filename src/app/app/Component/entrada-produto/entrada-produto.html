<div id="entrada-produto">
    <h1>Entrada de produto no Estoque</h1>

    <form class="formulario" (ngSubmit)="enviaDados()" ngNativeValidate>
        <label for="IdItem">Produto</label>
        <select name="IdItem" id="IdItem" required [(ngModel)]="IdItem" (ngModelChange)="selecionaProduto()">
            <option [ngValue]="0" selected>Selecione o Produto</option>
            @for (p of produtos; track p.IdItem){
            <option [ngValue]="p.IdItem">{{p.Item}}</option>
        }
        </select>

        <label for="QuantidadeEntrada">Entrada no Estoque</label>
        <input type="number" name="QuantidadeEntrada" id="QuantidadeEntrada" max="1000" required [(ngModel)]="QuantidadeEntrada">

        <label for="Unidade">Unidade de Medida</label>
        <select name="Unidade" id="Unidade" [(ngModel)]="Unidade">
            <option value="">Unidade do Produto</option>
            <option value="UN">UN</option>
            <option value="KG">KG</option>
            <option value="ML">ML</option>
        </select>

        <label for="dataentrada">Data de Entrada</label>
        <input type="date" name="dataentrada" id="dataentrada" required [(ngModel)]="DataEntradaProduto">

        <label for="ValorUnitarioEntrada">Valor Unitario de Entrada</label>
        <input type="number" name="ValorUnitarioEntrada" id="ValorUnitarioEntrada" required [(ngModel)]="ValorUnitarioEntrada" step="0.1">

        <div id="div-btns">
            <button type="submit" class="btn-submit">{{editar ? "Salvar Alterações" : "Cadastrar"}}</button>
            <button type="reset" class="btn-limpa">Limpar</button>
        </div>
    </form>

    <div id="div-cards">
        <div id="card">
            <div class="card">
                <h3 class="entrada-produto">Nome do produto</h3>

                <span class="valor-entrada">Valor de entrada</span><p></p>

                <span class="data-entrada">Data de entrada</span>

                <div id="btns-card">
                    <a href="" class="btn-excluir">Exluir</a><p></p>
                    <a href="" class="btn-edita">Editar</a>
                </div>
            </div>
        </div>
        
    </div>
</div>
