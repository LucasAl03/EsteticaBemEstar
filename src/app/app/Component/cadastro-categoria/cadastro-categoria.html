<div id="categorias">
    <h1>Cadastro de categorias</h1>

    <form class="formulario" (ngSubmit)="enviaDados()" ngNativeValidate>

        <label for="categoria">Categoria:</label>
        <input type="text" name="categoria" id="categoria" max="1000" required [(ngModel)]="categoria">

        <div id="div-btns">
            <button type="submit" class="btn-submit">{{editar ? "Salvar Alterações" : "Cadastrar"}}</button>
            <button type="reset" class="btn-limpa">Limpar</button>
        </div>
    </form>

    <div id="div-cards">
        <div id="card">
            @for (c of catego; track c.idCategoria) {
                <div class="card">
                    <h3 class="entrada-produto">Produto: {{c?.categoria}}</h3>
        
                    <div id="btns-card">
                        <a href="" class="btn-excluir">Excluir</a>
                        <a href="" class="btn-edita">Editar</a>
                    </div>
                </div>
            } @empty {
                <h3 class="entrada-produto">Nenhuma Categoria cadastrada.</h3>
            }
        </div>
        
    </div>
</div>
