<div id="cadastro">

    <h1>Cadastro</h1>

    <form id="pessoa-form" (ngSubmit)="enviaDados()" ngNativeValidate>

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" maxlength="70" [(ngModel)]="nome" inputmode="latin-name" required>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" minlength="11" maxlength="11" [(ngModel)]="cpf" required inputmode="numeric" (ngModelChange)="verificaCpf($event)">
        @if (cpfExiste) {
            <span class="msg-erro">Este CPF já está cadastrado.</span>
        }

        <label for="data_nascimento">Data de Nascimento</label>
        <input type="date" id="data_nascimento" name="data_nascimento" [(ngModel)]="dataNascimento" required>

        <label>Sexo</label>
        <div class="grupo-radio">
            <label><input type="radio" name="sexo" class="btnSelecao" value="M" [(ngModel)]="sexo" required> Masculino</label>
            <label><input type="radio" name="sexo" class="btnSelecao" value="F" [(ngModel)]="sexo" required> Feminino</label>
            <label><input type="radio" name="sexo" class="btnSelecao" value="N" [(ngModel)]="sexo" required> Não se Identificar</label>
        </div>
        
        <label for="email">Email</label>
        <input type="text" id="email" name="email" maxlength="100" [(ngModel)]="email" inputmode="email" required>

        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" name="telefone" minlength="8" maxlength="11" [(ngModel)]="telefone" inputmode="numeric" required>

        <h2>Endereço</h2>

        <label for="cep">Cep</label>
        <input type="text" id="cep" name="cep" maxlength="8" [(ngModel)]="cep" required>

        <label for="numero">numero</label>
        <input type="text" id="numero" name="numero" maxlength="10" [(ngModel)]="numero" inputmode="numeric" required>

        <label for="complemento">Complemento</label>
        <input type="text" id="complemento" name="complemento" maxlength="150" [(ngModel)]="complemento" required>

        @if (editar) {
            <label for="ativoPessoa">Situação do cadastro</label>
            <select name="ativoPessoa" id="ativoPessoa" [(ngModel)]="ativoPessoa">
                <option value="S">Ativo</option>
                <option value="N">Desativado</option>
            </select>
        }

        <div id="div-btns">
            <button type="submit" [disabled]="cpfExiste" >{{editar ? "Salvar Alterações" : "Cadastrar"}}</button>
            <button type="reset">Limpar</button>
        </div>

    </form>
</div>
