<div id="cadastro">

    <h1>Cadastro</h1>

    <form id="pessoa-form" (ngSubmit)="enviaDados()" ngNativeValidate>

        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" maxlength="70" [(ngModel)]="nome" required>

        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" maxlength="11" [(ngModel)]="cpf" required>

        <label for="data_nascimento">Data de Nascimento</label>
        <input type="date" id="data_nascimento" name="data_nascimento" [(ngModel)]="data_nascimento" required>
        
        <label for="email">Email</label>
        <input type="text" id="email" name="email" maxlength="120" [(ngModel)]="email" required>

        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" name="telefone" maxlength="11" [(ngModel)]="telefone" required>

        <h1>Endereço</h1>

        <label for="cep">Cep</label>
        <input type="text" id="cep" name="cep" maxlength="8" [(ngModel)]="cep" required>

        <label for="numero">Número</label>
        <input type="text" id="numero" name="numero" maxlength="10" [(ngModel)]="numero" required>

        <label for="complemento">Complemento</label>
        <input type="text" id="complemento" name="complemento" maxlength="150" [(ngModel)]="complemento" required>

        <div id="div-btns">
            <button type="submit">{{editar ? "Salvar Alterações" : "Cadastrar"}}</button>
            <button type="reset">Limpar</button>
        </div>

    </form>
</div>
